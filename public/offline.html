<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070b" />
    <title>Sem conexão · MBY Gestão</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at 50% 0%, #0b2440 0%, #05070b 60%);
        color: #e6edf7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 360px; }
      img { width: 96px; height: auto; margin-bottom: 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #9fb0c6; line-height: 1.5; }
      button {
        border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 700;
        background: #0a8bea; color: white; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/mby-logo.png" alt="MBY" />
      <h1>Você está sem conexão</h1>
      <p>O MBY Gestão precisa de internet para mostrar seus projetos e finanças atualizados.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
